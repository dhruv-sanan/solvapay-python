[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solvapay-python"
version = "0.9.0"
description = "Community Python SDK for SolvaPay (agent-native payment rails)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dhruv Sanan" }]
requires-python = ">=3.10"
keywords = ["solvapay", "payments", "agents", "mcp", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6,<2.13",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
langchain = ["langchain-core>=0.3,<0.4"]
mcp = ["fastmcp>=3.2.0,<4"]
asgi = []  # raw ASGI; no extra deps required
retry = ["tenacity>=8.2,<10"]

[project.urls]
Homepage = "https://github.com/dhruv-sanan/solvapay-python"
Issues = "https://github.com/dhruv-sanan/solvapay-python/issues"
"Official TS SDK" = "https://github.com/solvapay/solvapay-sdk"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "fastapi>=0.110",
    "langchain-core>=0.3,<0.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-cov>=7.1.0",
    "import-linter>=2.11",
    "tenacity>=8.2,<10",
    "towncrier>=23",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solvapay"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]   # line-length handled by formatter

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/solvapay"]

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tenacity", "tenacity.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["contract: sandbox contract tests (require SOLVAPAY_SANDBOX_KEY)"]
filterwarnings = [
    # Flat shim methods intentionally emit DeprecationWarning (removed in v2.0).
    # stacklevel=2 makes the warning appear from the test file, so module filter
    # doesn't match solvapay.* — use message prefix instead.
    "ignore:Flat method deprecated:DeprecationWarning",
]

[tool.towncrier]
package = "solvapay"
package_dir = "src"
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## [{version}] — {project_date}"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true
